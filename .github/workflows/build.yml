name: Gerar e publicar o CS2 Coach (Windows)

# Automático: sempre que o código do programa mudar na branch main, o GitHub gera o instalador
# e publica uma nova versão em Releases (numeração 5.0.N, onde N cresce sozinho a cada commit).
# Para mudar a versão "grande" (ex.: 5.0 -> 5.1), edite VERSAO_BASE abaixo.
# Manual: aba Actions > Run workflow gera os arquivos para teste, sem publicar.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "installer/**"
      - "cs2coach.spec"
      - "icone.ico"
      - "requirements*.txt"
  workflow_dispatch:

env:
  VERSAO_BASE: "5.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precisa do histórico para contar os commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Definir versão e repositório
        id: ver
        shell: pwsh
        run: |
          $n = (git rev-list --count HEAD).Trim()
          $v = "${{ env.VERSAO_BASE }}.$n"
          Set-Content -Path app\versao.py -Encoding utf8 -Value "VERSAO = `"$v`"", "REPO = `"${{ github.repository }}`""
          "versao=$v" >> $env:GITHUB_OUTPUT
          Get-Content app\versao.py
      - name: Instalar dependências
        run: pip install -r requirements-build.txt
      - name: Gerar o programa (PyInstaller)
        run: pyinstaller cs2coach.spec --noconfirm
      - name: Testar que o programa abre
        shell: pwsh
        run: |
          $env:CS2COACH_DADOS = "$PWD\teste_dados"
          $p = Start-Process -FilePath "dist\CS2Coach\CS2Coach.exe" -ArgumentList "--sem-navegador","--sem-bandeja","--porta","3199","--porta-gsi","3099" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:3199/ping" -UseBasicParsing
          Write-Host "ping =" $r.Content
          Stop-Process -Id $p.Id -Force
          if ($r.Content -ne "cs2coach-hub") { exit 1 }
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar o instalador
        run: iscc /DVersao="${{ steps.ver.outputs.versao }}" installer\cs2coach.iss
      - name: Guardar o instalador (para testes)
        uses: actions/upload-artifact@v4
        with:
          name: CS2Coach-Setup
          path: installer/Output/CS2Coach-Setup.exe
      - name: Publicar em Releases
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.versao }}"
          $nota = "**Para instalar:** baixe só o arquivo **CS2Coach-Setup.exe** logo abaixo (ignore 'Source code') e execute. Se o Windows avisar que protegeu o PC, clique em *Mais informações > Executar assim mesmo*. Seus dados e histórico são mantidos ao atualizar."
          gh release create "v$v" "installer/Output/CS2Coach-Setup.exe" --target "${{ github.sha }}" --title "CS2 Coach $v" --notes "$nota" --generate-notes
