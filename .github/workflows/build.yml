name: Gerar instalador do CS2 Coach (Windows)

permissions:
  contents: write           # necessário para publicar o Release

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    tags: ["v*"]            # ou: git tag v5.0.0 && git push --tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Definir versão (da tag) e repositório
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.0-teste" }
          Set-Content -Path app\versao.py -Encoding utf8 -Value "VERSAO = `"$v`"", "REPO = `"${{ github.repository }}`""
          "versao=$v" >> $env:GITHUB_OUTPUT
          Get-Content app\versao.py
      - name: Instalar dependências
        run: pip install -r requirements-build.txt
      - name: Gerar icone
        run: python gerar_icone.py
      - name: Gerar o programa (PyInstaller)
        run: pyinstaller cs2coach.spec --noconfirm
      - name: Testar que o programa abre
        shell: pwsh
        run: |
          $env:CS2COACH_DADOS = "$PWD\teste_dados"
          $p = Start-Process -FilePath "dist\CS2Coach\CS2Coach.exe" -ArgumentList "--sem-navegador","--sem-bandeja","--porta","3199","--porta-gsi","3099" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:3199/ping" -UseBasicParsing
          Write-Host "ping =" $r.Content
          Stop-Process -Id $p.Id -Force
          if ($r.Content -ne "cs2coach-hub") { exit 1 }
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar o instalador
        run: iscc /DVersao="${{ steps.ver.outputs.versao }}" installer\cs2coach.iss
      - name: Compactar versão portátil
        run: Compress-Archive -Path dist\CS2Coach -DestinationPath CS2Coach-portatil.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Coach-Windows
          path: |
            installer/Output/CS2Coach-Setup.exe
            CS2Coach-portatil.zip
      - name: Publicar em Releases (quando for uma tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/CS2Coach-Setup.exe
            CS2Coach-portatil.zip
